# Publish the website quickly from pinned release assets; rebuild the emulator and/or
# the native firmware only when their inputs change (or on manual request).
name: Site

on:
  push:
    branches: [main, natif]
    paths:
      - "index.html"
      - "duo-clock.js"
      - "duo-sync.js"
      - "engine.js"
      - "assets/**"
      - "firmwares/**"
      - "tools/**"
      - ".github/workflows/pages.yml"
  # Test emulator/firmware updates on pull requests without deploying or publishing releases.
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "index.html"
      - "duo-clock.js"
      - "duo-sync.js"
      - "backup.js"
      - "tests/test_duo.py"
      - "tests/test_duo_host.py"
      - "tests/test_duo_webkit.py"
      - "tests/conftest.py"
      - "tests/test_backup.py"
      - "firmwares/catalogue.json"
      - "firmwares/fiches/**"
      - "tests/catalogue.test.mjs"
      - "tests/fiches.test.mjs"
      - "tests/test_picker.py"
      - "tests/test_base_worklets.py"
      - "tools/**"
  workflow_dispatch:
    inputs:
      mode:
        description: What should be rebuilt?
        required: true
        type: choice
        default: site
        options:
          - site
          - runtime
          - full

permissions:
  contents: write
  pages: write
  id-token: write

# Never cancel a long native build just because another change was pushed.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

env:
  FM1_EMU_COMMIT: a0e9a88cba72a6de7368273c82e26867848e281d
  RUNTIME_TAG: runtime-a0e9a88
  EMSDK_VERSION: 3.1.64
  NATIF_TAG: natif-curated-v3

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.scope.outputs.native }}
      runtime: ${{ steps.scope.outputs.runtime }}
    steps:
      - uses: actions/checkout@v4
      - id: scope
        name: Select reusable assets or rebuilds
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          native=false
          runtime=false
          # A new emulator pin must also get a unique matching release tag.
          if [ "$RUNTIME_TAG" != "runtime-${FM1_EMU_COMMIT:0:7}" ]; then
            echo "::error::RUNTIME_TAG must match the first 7 digits of FM1_EMU_COMMIT"
            exit 1
          fi
          if [ "$EVENT" = "workflow_dispatch" ]; then
            case "$MODE" in
              full) native=true; runtime=true ;;
              runtime) runtime=true ;;
              site) ;;
              *) echo "::error::Unknown build mode: $MODE"; exit 1 ;;
            esac
          else
            # For a PR compare the generated merge commit to the base branch.
            # This avoids treating each PR as a new fork and rebuilding every native firmware.
            DIFF_BASE="$BEFORE"
            if [ "$EVENT" = "pull_request" ]; then DIFF_BASE="$PR_BASE"; fi
            if [ -z "$DIFF_BASE" ] || [[ "$DIFF_BASE" =~ ^0+$ ]]; then
              # New repository/branch: existing release assets will be checked below.
              native=false
              runtime=false
            elif ! git fetch --no-tags --depth=1 origin "$DIFF_BASE"; then
              echo "::warning::Previous commit unavailable; rebuild both asset families"
              native=true
              runtime=true
            else
              while IFS= read -r path; do
                case "$path" in
                  tools/fm1emu_vert.py) runtime=true ;;
                  tools/*) native=true ;;
                  .github/workflows/pages.yml) ;; # Pin/tag is checked by matching release availability below.
                esac
              done < <(git diff --name-only "$DIFF_BASE" "$GITHUB_SHA")
            fi
          fi
          # Bootstrap a new fork, or self-heal deleted release assets.
          if ! gh release view "$NATIF_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then native=true; fi
          if ! gh release view "$RUNTIME_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then runtime=true; fi
          echo "native=$native" >> "$GITHUB_OUTPUT"
          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"
          echo "Native rebuild: $native; emulator runtime rebuild: $runtime"

  liste:
    needs: plan
    if: needs.plan.outputs.native == 'true'
    runs-on: ubuntu-latest
    outputs:
      firmwares: ${{ steps.l.outputs.firmwares }}
    steps:
      - uses: actions/checkout@v4
      - id: l
        run: echo "firmwares=$(jq -c '.firmwares' tools/natif.json)" >> "$GITHUB_OUTPUT"

  natif:
    needs: liste
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        firmware: ${{ fromJSON(needs.liste.outputs.firmwares) }}
    name: natif ${{ matrix.firmware.id }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: fm1
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.firmware.depot }}
          ref: ${{ matrix.firmware.commit }}
          path: src
          submodules: recursive
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: mlugg/setup-zig@v2           # les firmwares compilés avec zig cc (champ zig de tools/natif.json)
        if: ${{ matrix.firmware.zig }}
        with:
          version: ${{ matrix.firmware.zig }}
          use-cache: false
      - name: Compilation depuis les sources
        env:
          NATIF_AVANT: ${{ matrix.firmware.avant }}
          NATIF_WASM: ${{ matrix.firmware.wasm }}
          NATIF_OUTILS_BASE: ${{ matrix.firmware.outils_base }}
          NATIF_OUTILS: ${{ join(matrix.firmware.outils, ' ') }}
          NATIF_ECHANTILLONS: ${{ matrix.firmware.echantillons }}
          NATIF_WORKLET: ${{ matrix.firmware.worklet }}
          NATIF_DIALECTE: ${{ matrix.firmware.dialecte }}
          NATIF_CONSTRUCTION: ${{ matrix.firmware.construction }}
        run: |
          pip install pillow fonttools numpy
          bash fm1/tools/natif_build.sh "${{ matrix.firmware.id }}" src "${{ matrix.firmware.script }}" out
      - uses: actions/upload-artifact@v4
        with:
          name: natif-${{ matrix.firmware.id }}
          path: out
          if-no-files-found: ignore

  build:
    needs: [plan, natif]
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' && (needs.natif.result == 'success' || needs.natif.result == 'skipped') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.native == 'true'
        with:
          pattern: natif-*
          path: _site/natif
          merge-multiple: true

      - uses: actions/checkout@v4
        if: needs.plan.outputs.runtime == 'true'
        with:
          repository: joakimeriksson/fm1-emu
          ref: ${{ env.FM1_EMU_COMMIT }}
          path: fm1-emu

      - name: WebAssembly target
        if: needs.plan.outputs.runtime == 'true'
        run: rustup target add wasm32-unknown-unknown

      - name: Add the FM-1 green PLAY LED
        if: needs.plan.outputs.runtime == 'true'
        run: python3 tools/fm1emu_vert.py fm1-emu fm1-emu/web/worklet.js

      - name: Compile emulator runtime
        if: needs.plan.outputs.runtime == 'true'
        working-directory: fm1-emu
        env:
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
          RUSTFLAGS: -Cllvm-args=-inline-threshold=2000 -Clink-arg=--export-table -Clink-arg=--growable-table
        run: cargo build --release -p fm1-web --target wasm32-unknown-unknown --target-dir target/wasm

      - name: Assemble website
        env:
          GH_TOKEN: ${{ github.token }}
          REBUILD_NATIVE: ${{ needs.plan.outputs.native }}
          REBUILD_RUNTIME: ${{ needs.plan.outputs.runtime }}
        run: |
          set -euo pipefail
          mkdir -p _site/runtime _site/natif
          cp index.html engine.js backup.js duo-clock.js duo-sync.js _site/
          for d in firmwares assets; do [ -d "$d" ] && cp -r "$d" _site/; done
          python3 tools/fetch_packages.py _site

          if [ "$REBUILD_RUNTIME" = "true" ]; then
            cp fm1-emu/target/wasm/wasm32-unknown-unknown/release/fm1_web.wasm _site/runtime/
            cp fm1-emu/web/worklet.js fm1-emu/web/persistence.js _site/runtime/
            # Keep the site's 60 Hz LCD updates (upstream defaults to 30 Hz).
            sed -i 's#sampleRate / 30#sampleRate / 60#' _site/runtime/worklet.js
            grep -q 'sampleRate / 60' _site/runtime/worklet.js
            cp fm1-emu/LICENSE _site/runtime/LICENSE-fm1-emu.txt
          else
            gh release download "$RUNTIME_TAG" -R "$GITHUB_REPOSITORY" -D _site/runtime
          fi

          if [ "$REBUILD_NATIVE" = "true" ]; then
            python3 -c "import json,glob,os; m={os.path.basename(os.path.dirname(f)): json.load(open(f)) for f in sorted(glob.glob('_site/natif/*/natif.json'))}; expected={f['id'] for f in json.load(open('tools/natif.json'))['firmwares']}; assert set(m)==expected, f'Native build mismatch, missing={sorted(expected-set(m))}, unexpected={sorted(set(m)-expected)}'; json.dump(m, open('_site/natif/manifest.json','w'), indent=1); print(len(m), 'native firmwares:', ' '.join(sorted(m)))"
            tar -czf natif.tar.gz -C _site natif
          else
            gh release download "$NATIF_TAG" -R "$GITHUB_REPOSITORY" -p natif.tar.gz -D .
            tar -xzf natif.tar.gz -C _site
          fi
          python3 -c "import json; expected={f['id'] for f in json.load(open('tools/natif.json'))['firmwares']}; actual=set(json.load(open('_site/natif/manifest.json'))); assert expected==actual, f'Native manifest is not curated: missing={sorted(expected-actual)}, extra={sorted(actual-expected)}'"

          test -s _site/backup.js
          test -s _site/duo-clock.js
          test -s _site/duo-sync.js
          test -s _site/runtime/fm1_web.wasm
          test -s _site/runtime/worklet.js
          test -s _site/runtime/persistence.js
          test -s _site/natif/manifest.json
          echo "::notice title=Site assets::runtime rebuilt=$REBUILD_RUNTIME, native rebuilt=$REBUILD_NATIVE"

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' || needs.plan.outputs.native == 'true' || needs.plan.outputs.runtime == 'true'
        with:
          name: site-natif
          path: natif.tar.gz

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' || needs.plan.outputs.native == 'true' || needs.plan.outputs.runtime == 'true'
        with:
          name: site-runtime
          path: _site/runtime

      - name: Publish emulator runtime
        if: github.ref == 'refs/heads/main' && needs.plan.outputs.runtime == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RUNTIME_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$RUNTIME_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "fm1-emu ${FM1_EMU_COMMIT:0:7}" \
              --notes "fm1_web.wasm compiled from joakimeriksson/fm1-emu@${FM1_EMU_COMMIT} (MIT), with worklet.js and persistence.js."
          gh release upload "$RUNTIME_TAG" _site/runtime/* --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish native firmware builds
        if: github.ref == 'refs/heads/main' && needs.plan.outputs.native == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$NATIF_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$NATIF_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Native firmware" \
              --notes "Firmware from tools/natif.json compiled for the browser from each author's source (original licenses retained)."
          gh release upload "$NATIF_TAG" natif.tar.gz --repo "$GITHUB_REPOSITORY" --clobber

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # chaque firmware natif démarre et dessine son écran ; le résultat en annotation (lisible sans les journaux)
  verification:
    needs: [plan, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && (github.event_name == 'pull_request' || needs.plan.outputs.native == 'true' || needs.plan.outputs.runtime == 'true') }}
    runs-on: ubuntu-latest
    # A failing sync/backup regression must block merging the PR; retain the
    # historical non-blocking firmware-compatibility annotations on main.
    continue-on-error: ${{ github.event_name != 'pull_request' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site-natif
      - uses: actions/download-artifact@v4
        with:
          name: site-runtime
          path: runtime
      - name: Browser test dependencies
        run: |
          pip install pytest playwright
          python -m playwright install --with-deps chromium webkit
      - name: Prepare native firmwares for browser tests
        if: github.event_name == 'pull_request' || needs.plan.outputs.native == 'true'
        run: tar -xzf natif.tar.gz
      - name: Download and verify updated CPU firmware packages
        if: github.event_name == 'pull_request'
        run: python3 tools/fetch_packages.py .
      - name: Catalogue, source provenance and curated firmware picker
        if: github.event_name == 'pull_request'
        run: |
          node --test tests/catalogue.test.mjs tests/fiches.test.mjs tests/readme.test.mjs
          python -m pytest -q tests/test_picker.py tests/test_base_worklets.py
      - name: Duo MIDI clock and regression tests
        if: github.event_name == 'pull_request'
        run: python -m pytest -q tests/test_duo.py tests/test_duo_host.py tests/test_backup.py tests/test_duo_webkit.py
      - name: Démarrage des firmwares natifs
        if: needs.plan.outputs.native == 'true'
        run: |
          rc=0   # (l'échec des tests ne doit pas arrêter le pas avant l'annotation : bash -e)
          python -m pytest -q tests/test_natif.py::test_granular_natives_make_sound tests/test_natif.py::test_base_native_capture_area_restored tests/test_natif.py::test_every_native_boots tests/test_natif.py::test_every_native_reacts tests/test_natif.py::test_pigeon_echantillons tests/test_natif.py::test_sim_gets_midi_in_its_format tests/test_natif.py::test_hortator_midi_and_saves tests/test_natif.py::test_zp12_midi_plays_pads tests/test_natif.py::test_zp12_samples tests/test_natif.py::test_melodee_plays tests/test_natif.py::test_gator_plays_and_saves tests/test_natif.py::test_modelar_drone tests/test_natif.py::test_beat_natives_play tests/test_natif.py::test_cutador_saves tests/test_natif.py::test_fmdj_rom tests/test_natif.py::test_keys_natives_play > verif.txt 2>&1 || rc=$?; cat verif.txt
          r=$( { grep -E "^E |passed|failed|rror" verif.txt || tail -5 verif.txt; } | head -30 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          if [ "$rc" = 0 ]; then echo "::notice title=vérification natifs::$r"; else echo "::error title=vérification natifs::$r"; fi
          exit "$rc"
      - name: Firmwares émulés, sur le cœur compilé
        if: ${{ !cancelled() && needs.plan.outputs.runtime == 'true' }}  # Run on engine updates, even if native tests failed
        run: |
          rc=0
          python -m pytest -q tests/test_emu.py tests/test_lights.py::test_emulated_play_colours tests/test_lights.py::test_emulated_levels > emu.txt 2>&1 || rc=$?; cat emu.txt
          r=$( { grep -E "^E |passed|failed|rror" emu.txt || tail -5 emu.txt; } | head -30 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          if [ "$rc" = 0 ]; then echo "::notice title=vérification émulés::$r"; else echo "::error title=vérification émulés::$r"; fi
          exit "$rc"

  deploy:
    needs: build
    # GitHub otherwise applies an implicit success() check: skipped optional native jobs
    # can prevent deployment even when "build" succeeded.
    if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
